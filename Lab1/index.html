<!DOCTYPE html>
<head>
    <title>Лабораторная работа 1 - Вариант 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Лабораторная работа №1</h2>
        <p><b>Вариант 7:</b> Сортировка перемешиванием (Cocktail sort)</p>
        <div class="form-group">
            <label for="arrayInput">Введите числа через запятую или пробел:</label><br>
            <input type="text" id="arrayInput" value="5, 1, 4, 2, 8, 0, 2">
        </div>

        <div class="buttons">
            <button onclick="sortArray()">Отсортировать массив</button>
        </div>
        <div class="result-box">
            <p><b>Исходный массив:</b> <span id="initialArray">-</span></p>
            <p><b>Отсортированный массив:</b> <span id="sortedArray">-</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
